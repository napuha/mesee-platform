name: MeSee Flutter release validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: mesee-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.7
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub
      - name: Build unsigned release bundle
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          timeout 8m flutter build appbundle --release --no-pub \
            --dart-define=APP_ENV=production \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            || (echo "Flutter post-build validation failed; retrying Gradle packaging"; cd android; timeout 8m ./gradlew bundleRelease --no-daemon)
      - name: Upload unsigned bundle
        uses: actions/upload-artifact@v4
        with:
          name: mesee-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
